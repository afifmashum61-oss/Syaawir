<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Pembelajaran Interaktif Bahasa Arab Kelas X - MAN 1 Pontianak</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;600;700&family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f2f7f8',
              100: '#e2f1f3',
              500: '#3b7a8c',
              600: '#2f6b78',
              700: '#1f4750',
              800: '#163339',
            }
          }
        }
      }
    }
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="logo.webp" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-[#f2f7f8] text-slate-800 antialiased min-h-screen flex flex-col selection:bg-teal-500 selection:text-white">

  <!-- TOP HEADER & BRANDING BAR -->
  <header id="app-header" class="bg-white border-b border-slate-200/80 sticky top-0 z-50 shadow-sm backdrop-blur-md bg-white/95">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- School Logo & Branding -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">
          <img src="logo.webp" alt="Logo MAN 1 Pontianak" class="w-12 h-12 object-contain hover:scale-105 transition-transform" />
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight leading-none">
                MAN 1 PONTIANAK
              </h1>
              <span class="px-2 py-0.5 bg-teal-100 text-[#2f6b78] text-[10px] font-extrabold rounded-full uppercase tracking-wider">Kelas X</span>
            </div>
            <p class="text-xs font-semibold text-slate-500 mt-1 flex items-center gap-1">
              <span>Media Pembelajaran Interaktif Bahasa Arab</span>
              <span class="font-arabic text-sm text-[#2f6b78] font-bold">| اللغة العربية</span>
            </p>
          </div>
        </div>

        <!-- User Login / Profile Badge Header -->
        <div id="user-header-badge" class="flex items-center gap-2">
          <!-- Dynamic User / Login Button rendered via app.js -->
        </div>

      </div>

      <!-- MAIN NAVIGATION TABS (MENU UTAMA BAHASA ARAB) -->
      <nav class="flex items-center gap-1 sm:gap-2 overflow-x-auto py-2 border-t border-slate-100 scrollbar-none">
        
        <button data-tab="home" class="nav-tab active px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>🏠 Beranda</span>
        </button>

        <button data-tab="mufrodat" class="nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>🔤</span>
          <span class="font-arabic text-lg font-bold">المفردات</span>
        </button>

        <button data-tab="kalam" class="nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>🗣️</span>
          <span class="font-arabic text-lg font-bold">مهارة الكلام</span>
        </button>

        <button data-tab="qiraah" class="nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>📖</span>
          <span class="font-arabic text-lg font-bold">مهارة القراءة</span>
        </button>

        <button data-tab="istima" class="nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>🎧</span>
          <span class="font-arabic text-lg font-bold">مهارة الاستماع</span>
        </button>

        <button data-tab="qawaid" class="nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>📐</span>
          <span class="font-arabic text-lg font-bold">القواعد</span>
        </button>

        <button data-tab="tadribat" class="nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2">
          <span>📝</span>
          <span class="font-arabic text-lg font-bold">التدريبات</span>
        </button>

        <!-- Dynamic Guru Dashboard Tab (Visible when logged in as Guru) -->
        <button id="nav-btn-guru" data-tab="guru-dashboard" class="hidden nav-tab px-4 py-2.5 text-xs sm:text-sm whitespace-nowrap flex items-center gap-2 bg-amber-50 text-amber-800 border border-amber-200/80 rounded-xl font-bold ml-auto">
          <span>👨‍🏫 Dashboard Guru</span>
        </button>

      </nav>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT CONTAINER -->
  <main id="main-container" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Dynamic JS Content rendered here -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 mt-12 py-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 space-y-2">
      <p class="font-semibold text-slate-700">
        Media Pembelajaran Interaktif Bahasa Arab Kelas X © 2026 MAN 1 Pontianak
      </p>
      <p class="text-slate-600">
        👨‍🏫 Guru Pengajar: <strong class="text-slate-800 font-bold">Yosi, S. Ag, M. Pd.</strong> — Madrasah Aliyah Negeri 1 Pontianak
      </p>
    </div>
  </footer>

  <!-- App Data & Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
